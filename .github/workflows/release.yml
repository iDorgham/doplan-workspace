name: Release

on:
  push:
    tags:
      - 'cli/v*'
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/cli/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/cli/v}
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Install dependencies (workspace)
        run: npm install
        working-directory: .

      - name: Install dependencies (CLI)
        run: npm install
        working-directory: cli

      - name: Run linter
        run: npm run lint
        working-directory: cli

      - name: Run tests
        run: npm test -- --run
        working-directory: cli

      - name: Build CLI
        run: npm run build
        working-directory: cli

      - name: Update package version
        run: |
          cd cli
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}" || true

      - name: Publish to npm
        run: |
          cd cli
          if [[ "${{ github.ref }}" == refs/tags/cli/* ]]; then
            npm publish --access public --tag latest
          else
            npm publish --access public --tag alpha
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## DoPlan CLI ${{ steps.version.outputs.version }}
            
            See [CHANGELOG.md](cli/CHANGELOG.md) for details.
            
            ### Installation
            ```bash
            npm install -g doplan-cli
            ```
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

